        if (cells[v] >= 0) continue;

        p.push(v);
        if (grow(k, p)) return true;
        p.pop();
        cells[v] = -1;
      }
      return false;

function logicPuzzle() {
  return today$("logic", () => {
    let r = rng("logic"),
      g = Array(16).fill(0);
    let ok = (g, i) => {
      let v = g[i],
        R = i >> 2,
        C = i & 3,
        B = (R >> 1) * 8 + (C >> 1) * 2;

      if (i === 16) return true;
      for (let v of shuf([1, 2, 3, 4], r)) {
        g[i] = v;
        if (ok(g, i) && fill(i + 1)) return true;
      }
      g[i] = 0;

    };

      let i = g.indexOf(0);
      if (i < 0) return 1;
      let n = 0;
      for (let v = 1; v <= 4 && n < lim; v++) {
        g[i] = v;
        if (ok(g, i)) n += count(g, lim - n);

      g[i] = 0;

    };
    fill(0);

      given = [...Array(16).keys()],
      target = 5 + r(2);

            `<polyline class="draw" pathLength="1" ${d(0.2 + k * 0.18)} points="${p.map((i) => X(i) + "," + Y(i)).join(" ")}" fill="none" stroke="${hue[k]}" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>`,
        )
        .join("") +
        L.map(
          (ch, i) =>
            `<g class="pop" ${d(0.15 + i * 0.03)}><rect x="${X(i) - 19}" y="${Y(i) - 19}" width="38" height="38" rx="9" fill="#fff" stroke="${hue[paths.findIndex((p) => p.includes(i))]}" stroke-width="3"/><text x="${X(i)}" y="${Y(i) + 7}" text-anchor="middle" font-size="20" font-weight="800" fill="#1d2b25">${ch}</text></g>`,
        ).join(""),
    );
  }
  if (id === "trail") {
    let own = state().data.path,
      path = own.length === TC ? own : trailSolution(),
      cp = checkpoints(),
      X = (i) => 34 + (i % TN) * 32,
      Y = (i) => 34 + Math.floor(i / TN) * 32;
    return svg(
      Array.from({ length: TC }, (_, i) => `<circle cx="${X(i)}" cy="${Y(i)}" r="3" fill="#1d2b25" opacity=".16"/>`).join("") +
        `<polyline class="draw slow" pathLength="1" points="${path.map((i) => X(i) + "," + Y(i)).join(" ")}" fill="none" stroke="var(--c)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>` +
        Object.entries(cp)
          .map(
            ([i, n]) =>
              `<g class="pop" ${d(0.2 + n * 0.17)}><circle cx="${X(+i)}" cy="${Y(+i)}" r="12" fill="var(--k)" stroke="#fff" stroke-width="3"/><text x="${X(+i)}" y="${Y(+i) + 4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${n}</text></g>`,
          )
          .join(""),
    );
  }
  if (id === "logic") {
    let sol = logicSolution(),
      fixed = givens(),
      X = (i) => 40 + (i % 4) * 46 + (i % 4 > 1 ? 8 : 0),
      Y = (i) => 40 + Math.floor(i / 4) * 46 + (i > 7 ? 8 : 0);
    return svg(
      sol
        .map(
          (v, i) =>
            `<g class="pop" ${d(0.15 + i * 0.04)}><rect x="${X(i)}" y="${Y(i)}" width="42" height="42" rx="9" fill="${fixed.includes(i) ? "var(--k)" : "#fff"}" stroke="var(--c)" stroke-width="${fixed.includes(i) ? 0 : 2.5}"/><text x="${X(i) + 21}" y="${Y(i) + 29}" text-anchor="middle" font-size="21" font-weight="800" fill="${fixed.includes(i) ? "#fff" : "var(--k)"}">${v}</text></g>`,
        )
        .join(""),
    );
  }
  if (id === "risk") {
    let list = todayCases(),
      color = { Bribery: hue[0], Privacy: hue[1], Conflict: hue[2], Fraud: hue[3] },
      seen = {};
    return svg(
      `<circle cx="130" cy="130" r="104" fill="#fff"/>${[34, 69, 104].map((r) => `<circle cx="130" cy="130" r="${r}" fill="none" stroke="var(--k)" stroke-opacity=".18" stroke-width="1.5"/>`).join("")}<path d="M130 26v208M26 130h208" stroke="var(--k)" stroke-opacity=".14" stroke-width="1.5"/><g class="sweep"><path d="M130 130L130 26A104 104 0 0 1 220 78Z" fill="var(--c)" opacity=".28"/><path d="M130 130L220 78" stroke="var(--c)" stroke-width="3" stroke-linecap="round"/></g>` +
        list
          .map(([, c], k) => {
            let q = RISK_CATS.indexOf(c),
              m = (seen[c] = (seen[c] || 0) + 1),
              a = ((q * 90 + (m === 1 ? 28 : 62)) * Math.PI) / 180,
              rad = m === 1 ? 52 : 84,
              x = 130 + Math.sin(a) * rad,
              y = 130 - Math.cos(a) * rad;
            return `<g class="pop" ${d(0.35 + k * 0.12)}><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${color[c]}" stroke="#fff" stroke-width="3"/></g>`;
          })
          .join("") +
        RISK_CATS.map(
          (c, q) =>
            `<text x="${q < 2 ? 246 : 22}" y="${[22, 154, 248, 22][q]}" text-anchor="${q < 2 ? "end" : "start"}" paint-order="stroke" stroke="#fff" stroke-width="4" font-size="12" font-weight="800" fill="${color[c]}">${c}</text>`,
        ).join(""),
    );
  }
  if (id === "sequence")
    return svg(
      incident()
        .steps.map(
          (_, i) =>
            `<g class="slide" ${d(0.15 + i * 0.1)}><rect x="30" y="${28 + i * 35}" width="200" height="27" rx="13.5" fill="#fff"/><circle cx="44" cy="${41.5 + i * 35}" r="10" fill="var(--k)"/><text x="44" y="${46 + i * 35}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${i + 1}</text><rect x="62" y="${37 + i * 35}" width="${[118, 96, 128, 84, 110, 74][i]}" height="9" rx="4.5" fill="var(--k)" opacity=".18"/><path d="M206 ${41.5 + i * 35}l4 4 8-9" fill="none" stroke="var(--c)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`,
        )
        .join(""),
    );
  let code = officeDigits();
  return svg(
    `<rect x="58" y="30" width="144" height="210" rx="6" fill="var(--k)"/><path d="M66 38h128v202H66Z" fill="#fff6d8"/><path class="beam" d="M66 240h128l60 20H6Z" fill="#fff6d8" opacity=".55"/><g class="door"><rect x="66" y="38" width="128" height="202" fill="var(--c)"/><rect x="80" y="54" width="100" height="70" rx="5" fill="#fff" opacity=".22"/><rect x="80" y="138" width="100" height="86" rx="5" fill="#fff" opacity=".22"/><circle cx="176" cy="140" r="6" fill="#fff"/></g>` +
      code
        .map(
          (n, i) =>
            `<g class="pop" ${d(0.9 + i * 0.12)}><rect x="${76 + i * 28}" y="6" width="24" height="30" rx="6" fill="#fff" stroke="var(--k)" stroke-width="2.5"/><text x="${88 + i * 28}" y="27" text-anchor="middle" font-size="17" font-weight="800" fill="var(--k)">${n}</text></g>`,
        )
        .join(""),
  );
}
function results() {
  let s = state(),
    g = game(),
    p = PALETTE[active],
    sub =
      s.score === 1000
        ? "A perfect solve: no hints, no missteps."
        : s.hints === 0
          ? "No hints needed. Sharp instincts."
          : "Solved, and every hint taught you something.",
    takeaway = {
      office: "A safe workplace depends on noticing small details: declared gifts, restricted access, clear retention rules, and disclosed conflicts.",
      weave: "Words like risk, duty, and care matter most when they turn into everyday actions.",
      trail: "A clear audit trail connects decisions to evidence. Avoid gaps and keep records in order.",
      logic: "Access controls work best when permissions are deliberate, consistent, and reviewed.",
      risk: "Naming a risk is the first step toward responding well. Raise concerns through your organization’s channels.",
      sequence: "A calm, structured response protects people and preserves evidence. Follow your organization’s approved playbook.",
    }[active],
    extra =
      active === "weave"
        ? `<ul class="takeaways">${words().map((w) => `<li><b>${w}</b> ${TIPS[w]}</li>`).join("")}</ul>`
        : "",
    burst = celebrate
      ? `<div class="burst" aria-hidden="true">${Array.from({ length: 22 }, (_, i) => {
          let a = (i / 22) * Math.PI * 2 + Math.random() * 0.3,
            dist = 70 + Math.random() * 90;
          return `<i style="--x:${(Math.cos(a) * dist).toFixed(0)}px;--y:${(Math.sin(a) * dist - 30).toFixed(0)}px;--r:${(Math.random() * 540 - 270).toFixed(0)}deg;--p:${[p.c, p.k, "#fff", ["#ff5a36", "#2f8cff", "#f5a300", "#8a5cff"][i % 4]][i % 4]};${i % 3 ? "" : "border-radius:50%;width:10px;height:10px"}"></i>`;
        }).join("")}</div>`
      : "";
  celebrate = false;
  $("#app").innerHTML =
    `<div class="game-layout"><section><div class="win" style="--t:${p.t};--c:${p.c};--k:${p.k}"><div class="win-copy"><h2 class="win-title">${WIN[active]}</h2><p class="win-sub">${sub} You completed ${g.name}, edition ${mod(seed(), 999) + 1}.</p><dl class="ledger">${[
      ["Points", `<span id="score" data-to="${s.score}" aria-hidden="true">${s.score}</span><span class="sr">${s.score}</span>`],
      ["Solve time", time(s.elapsed)],
      ["Hints used", s.hints],
      ["Missteps", s.mistakes],
    ]
      .map(([k, v], i) => `<div style="--i:${i}"><dt>${k}</dt><i></i><dd>${v}</dd></div>`)
      .join("")}</dl><div class="actions"><button class="play" onclick="home()">Play another game ${ICON.arrow}</button><button class="outline" onclick="copyScore()">Copy score</button></div><p id="copy-status" role="status" class="win-note">${doneCount()} of ${games.length} daily puzzles complete</p></div><div class="win-art">${resultArt(active)}<div class="stamp" aria-hidden="true">Solved<small>No. ${mod(seed(), 999) + 1}</small></div>${burst}</div></div><div class="panel"><h3>Take it into your workday</h3><p class="muted">${takeaway}</p>${extra}<button class="outline" onclick="practice=true;msg='Completed puzzle · Your recorded score is preserved.';renderGame()">See completed puzzle</button></div></section><aside class="panel instructions"><h3>${streak()}-day streak</h3><p>A solve in any game keeps your daily streak going.</p><div class="chips">${games.map((x) => `<span class="chip ${daily()[x.id]?.done ? "done" : ""} ${x.id === active ? "now" : ""}" style="--c2:${PALETTE[x.id].c}" title="${x.name}${daily()[x.id]?.done ? ", solved" : ""}">${daily()[x.id]?.done ? ICON.check : ""}</span>`).join("")}</div><h3>Keep the momentum</h3>${games
      .filter((x) => x.id !== active)
      .map(
        (x) =>
          `<button class="next-game" onclick="openGame('${x.id}')"><span class="swatch" style="background:${PALETTE[x.id].t};color:${PALETTE[x.id].k}">${daily()[x.id]?.done ? ICON.check : ""}</span><span class="next-name">${x.name}<small>${daily()[x.id]?.done ? "Solved today" : x.time}</small></span>${ICON.arrow}</button>`,
      )
      .join("")}</aside></div>${footer()}`;
  countUp();
}
// Counts the score up from zero; the final value is already in the markup if this never runs
function countUp() {
  let el = $("#score");
  if (
    !el ||
    typeof requestAnimationFrame !== "function" ||
    typeof matchMedia !== "function" ||
    matchMedia("(prefers-reduced-motion: reduce)").matches
  )
    return;
  let to = +el.dataset.to,
    t0 = performance.now() + 350,
    step = (t) => {
      let k = Math.max(0, Math.min(1, (t - t0) / 900));
      el.textContent = Math.round(to * (1 - Math.pow(1 - k, 4)));
      if (k < 1) requestAnimationFrame(step);
    };
  el.textContent = "0";
  requestAnimationFrame(step);
}
async function copyScore() {
  let text = `Compliance IQ · ${day}\n${game().name}: ${state().score} points · ${time(state().elapsed)} · ${state().hints} hints\n${doneCount()}/${games.length} daily puzzles`;
  try {
    await navigator.clipboard.writeText(text);
    $("#copy-status").textContent = "Score copied. Share it wherever you like.";
  } catch (e) {
    $("#copy-status").innerHTML =
      '<label>Copy your result:<textarea readonly style="width:100%;height:100px">' +
      esc(text) +
      "</textarea></label>";
    $("#copy-status textarea").select();
  }
}
function showStats() {
  active = null;
  let badges = [
    ["✦", "First instinct", "Complete your first puzzle", total() >= 1],
    [
      "✺",
      "Clean sweep",
      "Complete all six in one day",
      Object.values(store.wins).some((v) => games.every((g) => v[g.id])),
    ],
    ["♜", "On a roll", "Solve on 3 consecutive days", maxStreak() >= 3],
    [
      "◇",
      "Clear thinker",
      "Complete a puzzle with no hints",
      Object.values(store.wins).some((v) =>
        Object.values(v).some((x) => x.hints === 0),
      ),
    ],
  ];
  $("#app").innerHTML =
    `<button class="outline" onclick="home()">← Today’s games</button><h1 style="font-size:48px;margin-top:26px">A habit worth keeping.</h1><p class="muted">Your progress stays on this browser.</p><section class="panel"><div class="stats"><div><strong>${total()}</strong><span>puzzles solved</span></div><div><strong>${streak()}</strong><span>current day streak</span></div><div><strong>${maxStreak()}</strong><span>best day streak</span></div></div></section><h2 style="margin-top:30px">Your badges</h2><div class="badge-grid">${badges.map((b) => `<div class="badge ${b[3] ? "earned" : ""}"><b>${b[0]}</b><strong>${b[1]}</strong><br><span>${b[2]}<br>${b[3] ? "Unlocked ✓" : "Keep going"}</span></div>`).join("")}</div><h2 style="margin-top:30px">Recent solves</h2><section class="panel">${
      Object.keys(store.wins)
        .sort()
        .reverse()
        .slice(0, 7)
        .map(
          (d) =>
            `<div style="margin-bottom:15px"><strong>${d}</strong><div class="muted" style="font-size:14px">${Object.entries(
              store.wins[d],
            )
              .map(
                ([id, v]) =>
                  `${games.find((g) => g.id === id)?.name}: ${v.score} points (${time(v.time)})`,
              )
              .join(" · ")}</div></div>`,
        )
        .join("") ||
      '<p class="muted">Your first solve is waiting. Pick a game to get started.</p>'
    }</section>${footer()}`;
  window.scrollTo(0, 0);
}
function maxStreak() {
  let dates = Object.keys(store.wins).sort(),
    max = 0,
    n = 0,
    prev = -Infinity;
  for (let d of dates) {
    let num = dayNumber(d);
    n = num === prev + 1 ? n + 1 : 1;
    max = Math.max(n, max);
    prev = num;
  }
  return max;
}
setInterval(() => {
  if (today() !== day) {
    save();
    day = today();
    active = null;
    home();
    return;
  }
  if (active && !document.hidden && !state().done) {
    state().elapsed++;
    let el = $("#timer");
    if (el) el.textContent = time(state().elapsed);
    save();
  }
}, 1000);
document.addEventListener("keydown", (e) => {
  if (
    !active ||
    state().done ||
    ["INPUT", "TEXTAREA"].includes(e.target.tagName)
  )
    return;
  if (active === "logic" && /^[0-4]$/.test(e.key)) {
    e.preventDefault();
    put(+e.key);
  } else if (active === "logic" && ["Backspace", "Delete"].includes(e.key)) {
    e.preventDefault();
    put(0);
  } else if (active === "trail" && e.key.startsWith("Arrow")) {
    e.preventDefault();
    let p = state().data.path,
      last = p.at(-1);
    if (last === undefined) {
      trailTap(trailSolution()[0]);
      return;
    }
    let delta = { ArrowUp: -TN, ArrowDown: TN, ArrowLeft: -1, ArrowRight: 1 }[
        e.key
      ],
      next = last + delta;
    if (next >= 0 && next < TC && adjacent(last, next, TN)) trailTap(next);
  } else if ((e.ctrlKey || e.metaKey) && e.key === "z") {
    e.preventDefault();
    undo();
  }
});
home();
