function home(){active=null;history=[];practice=false;let count=doneCount();$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">The daily brain break · ${new Date(day+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div><h1>A little play.<br>A sharper instinct.</h1><p>Six small challenges for a more thoughtful workday. Build your compliance instincts, one satisfying solve at a time.</p></div><aside class="daily"><div class="eyebrow">Your daily six</div><div style="margin-top:10px"><strong>${count}<span style="font-size:20px;color:var(--muted)"> / ${games.length}</span></strong> <span class="muted">puzzles complete</span></div><div class="dots">${games.map((g,i)=>`<span class="dot ${daily()[g.id]?.done?'yes':''}">${daily()[g.id]?.done?'✓':i+1}</span>`).join('')}</div><span style="font-size:13px">${count===games.length?'A clean sweep. See you tomorrow!':count?'Nice momentum. Keep your curiosity going.':'A fresh start. Pick a puzzle below.'}</span></aside></section><div class="section-head"><h2>Today’s games</h2><span class="muted">Edition ${mod(seed(),999)+1} · New puzzles daily</span></div><section class="cards">${games.map(g=>`<article class="card">${art(g)}<div class="card-body"><div class="meta"><span>${g.type}</span><span>${g.time}</span></div><h3 style="margin-top:12px">${g.name}</h3><p>${g.desc}</p><button class="play" onclick="openGame('${g.id}')"><span>${daily()[g.id]?.done?'View results':daily()[g.id]?'Continue playing':'Play puzzle'}</span><span>${daily()[g.id]?.done?'✓':'↗'}</span></button></div></article>`).join('')}</section><div class="strip"><div><strong>Not a test. A little training for your instincts.</strong><p>Learn as you play, use a hint when you need one, and find your own pace.</p></div><span class="pill">${streak()} day streak ✦</span></div>${footer()}`}
function openGame(id){active=id;history=[];selected=-1;practice=false;msg='';state();save();renderGame();window.scrollTo(0,0)}function words(){return wordSets[mod(seed(),3)]}function wordPaths(){let paths=[[0,1,2,3],[7,11,15,14],[13,12,8,4],[5,6,10,9]],turns=mod(seed(),4);return paths.map(path=>path.map(i=>{let r=Math.floor(i/4),c=i%4;for(let k=0;k<turns;k++)[r,c]=[c,3-r];return r*4+c}))}function letters(){let cells=Array(16);words().forEach((w,r)=>wordPaths()[r].forEach((i,c)=>cells[i]=w[c]));return cells}function wordOwner(i){return wordPaths().findIndex(p=>p.includes(i))}function foundTiles(){let d=state().data;return d.found.flatMap(w=>d.routes?.[w]||wordPaths()[words().indexOf(w)])}function adjacent(a,b,n){return Math.abs(Math.floor(a/n)-Math.floor(b/n))+Math.abs(a%n-b%n)===1}function trailSolution(){let a=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++)a.push(r*5+(r%2?4-c:c));let turns=mod(seed(),4);return a.map(i=>{let r=Math.floor(i/5),c=i%5;for(let k=0;k<turns;k++)[r,c]=[c,4-r];return r*5+c})}function checkpoints(){let sol=trailSolution();return Object.fromEntries([0,4,9,14,19,24].map((v,i)=>[sol[v],i+1]))}function logicSolution(){let base=[1,2,3,4,3,4,1,2,2,1,4,3,4,3,2,1],shift=mod(seed(),4);return base.map(x=>(x-1+shift)%4+1)}function givens(){return mod(seed(),2)?[0,3,5,6,9,10,12,15]:[0,2,5,7,8,10,13,15]}function logicValues(){return logicSolution().map((v,i)=>givens().includes(i)?v:state().data.values[i])}function incident(){return incidents[mod(seed(),3)]}function caseAt(i){return cases[mod(i+seed(),8)]}
const rules={office:['Inspect the four objects in the office. Each contains a small compliance puzzle.','Solve each clue to collect a digit. Your notebook saves everything you discover.','Select the exit door, then enter the digits in DESK → SCREEN → FILES → BOARD order. This is a fictional training room.'],weave:['Find four words, using every tile exactly once.','Tap adjacent letters horizontally or vertically, then submit the word. Each word has four letters.','Tap your last tile or Undo to step back. Found words stay highlighted.'],trail:['Start at checkpoint 1 and connect all six checkpoints in numerical order.','Move horizontally or vertically. Visit every square exactly once. Tap cells or use arrow keys.','Tap an earlier cell to rewind. A hint extends the reference path, or points out a branch to revisit.'],logic:['Fill the 4 × 4 grid with codes 1, 2, 3, and 4.','Each row, column, and bold 2 × 2 region must contain each code once. Dark numbers are fixed.','Select a cell, then use the code buttons or keyboard. Any valid completed grid is accepted.'],risk:['Read eight workplace situations and identify the primary risk.','Choose Bribery, Privacy, Conflict, or Fraud. Every choice comes with an explanation.','A wrong answer stays on the current card so you can learn and try again.'],sequence:['Read the response playbook for today’s incident.','Use the up and down arrows to arrange six actions from first to last.','The scenario and hint show the approved order for this exercise. Check your sequence when ready.']};
function renderGame(){let s=state(),g=game();if(s.done&&!practice){results();return}let body='';if(active==='office')body=officeBody();if(active==='weave'){body=`<div class="word-status">${words().map((w,i)=>`<span class="tag">${s.data.found.includes(w)?w+' ✓':`Word ${i+1} · 4 letters`}</span>`).join('')}</div><div class="board grid" style="grid-template-columns:repeat(4,1fr)">${letters().map((c,i)=>`<button aria-label="${c}, row ${Math.floor(i/4)+1}, column ${i%4+1}" class="tile ${s.data.path.includes(i)?'selected':''} ${foundTiles().includes(i)?'found':''}" onclick="wordTap(${i})">${c}</button>`).join('')}</div><div style="text-align:center;letter-spacing:5px;min-height:36px;font-weight:700">${s.data.path.map(i=>letters()[i]).join('')||'· · · ·'}</div><button class="play" style="width:100%;margin-bottom:20px" onclick="submitWord()">Submit word</button>`}if(active==='trail'){let cp=checkpoints(),path=s.data.path;body=`<div class="board grid" style="grid-template-columns:repeat(5,1fr);gap:3px">${Array.from({length:25},(_,i)=>`<button aria-label="Row ${Math.floor(i/5)+1}, column ${i%5+1}${cp[i]?', checkpoint '+cp[i]:''}${path.includes(i)?', visited step '+(path.indexOf(i)+1):''}" class="tile ${path.includes(i)?'selected':''} ${path.at(-1)===i?'last':''}" onclick="trailTap(${i})">${cp[i]|| (path.includes(i)?'•':'')} ${path.includes(i)?`<small>${path.indexOf(i)+1}</small>`:''}</button>`).join('')}</div><p style="text-align:center" class="muted">${path.length} / 25 cells · ${Object.keys(cp).filter(i=>path.includes(+i)).length} / 6 checkpoints</p>`}if(active==='logic'){body=`<div class="board grid" style="grid-template-columns:repeat(4,1fr);gap:3px">${logicValues().map((v,i)=>`<button class="tile ${selected===i?'selected':''}" style="${givens().includes(i)?'background:#e3e8d9;color:#203931;':''}${i%4===1?'border-right:3px solid #56654f;':''}${Math.floor(i/4)===1?'border-bottom:3px solid #56654f;':''}" aria-label="Row ${Math.floor(i/4)+1}, column ${i%4+1}, ${v||'empty'}${givens().includes(i)?', fixed':''}" onclick="selectCell(${i})">${v||''}</button>`).join('')}</div><div class="keypad">${[1,2,3,4,0].map(v=>`<button onclick="put(${v})" aria-label="${v?'Enter '+v:'Clear cell'}">${v||'⌫'}</button>`).join('')}</div><button class="play" style="width:100%;margin-bottom:20px" onclick="checkLogic()">Check grid</button>`}if(active==='risk'){let n=s.data.answers.length;body=`<div class="eyebrow">Situation ${n+1} of 8</div><div class="progress"><i style="width:${n/8*100}%"></i></div><p class="prompt">${caseAt(n)[0]}</p><div class="choices">${['Bribery','Privacy','Conflict','Fraud'].map(c=>`<button class="choice" onclick="answer('${c}')">${c} <span style="float:right">↗</span></button>`).join('')}</div><p class="hint-copy">Choose the primary risk. More than one issue can exist in a real situation.</p>`}if(active==='sequence'){body=`<div class="eyebrow">${incident().title}</div><p class="muted" style="font-size:14px;margin-top:10px">${incident().context}</p><details style="font-size:14px"><summary>Read the approved playbook</summary><ol>${incident().steps.map(t=>`<li>${t}</li>`).join('')}</ol></details><ol class="sequence">${s.data.order.map((v,i)=>`<li class="step"><b>${i+1}</b><span>${incident().steps[v]}</span><button aria-label="Move step ${i+1} up" ${i===0?'disabled':''} onclick="move(${i},-1)">↑</button><button aria-label="Move step ${i+1} down" ${i===5?'disabled':''} onclick="move(${i},1)">↓</button></li>`).join('')}</ol><button class="play" style="width:100%;margin-bottom:20px" onclick="checkSequence()">Check sequence</button>`}
$('#app').innerHTML=`<div class="section-head"><div class="game-title"><button class="outline" onclick="home()" aria-label="Back to game directory">←</button><div><div class="eyebrow">Daily ${game().type} · Edition ${mod(seed(),999)+1}</div><h1>${g.name}</h1></div></div></div><div class="game-layout"><section class="panel"><div class="game-top"><span class="pill">${practice?'Completed puzzle':g.time+' · Take your time'}</span><span class="timer" id="timer" aria-label="Elapsed time">${time(s.elapsed)}</span></div>${body}<div class="actions"><button class="outline" onclick="undo()" ${!history.length?'disabled':''}>↶ Undo</button><button class="outline" onclick="hint()">✧ Hint</button><button class="outline" onclick="resetGame()">Reset</button></div><div class="message" id="feedback" role="status" aria-live="polite">${esc(msg||'You’ve got this. Take it one move at a time.')}</div></section><aside class="panel instructions"><h3>How to play</h3><ol>${rules[active].map(r=>`<li style="margin-bottom:12px">${r}</li>`).join('')}</ol><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>A little help is welcome.</h3><p>Hints cost 30 points; incorrect checks cost 15. Time is for your own pace and does not reduce your score.</p><div class="tag">${s.hints} hints used</div><div class="tag">${s.mistakes} incorrect checks</div><p class="hint-copy">Progress saves automatically on this browser. The next edition arrives at local midnight.</p></aside></div>${footer()}`}
function editable(){return !state().done}function wordTap(i){if(!editable())return;let d=state().data;if(foundTiles().includes(i))return;if(d.path.at(-1)===i){snapshot();d.path.pop();commit();return}if(d.path.includes(i)||d.path.length===4||d.path.length&&!adjacent(d.path.at(-1),i,4)){notice('Use up to four adjacent tiles, without repeating a tile.');return}snapshot();d.path.push(i);commit()}function submitWord(){if(!editable())return;let s=state(),d=s.data,w=d.path.map(i=>letters()[i]).join('');if(words().includes(w)&&!d.found.includes(w)){snapshot();d.routes||={};d.routes[w]=[...d.path];d.found.push(w);d.path=[];msg=`${w} found. ${ {RISK:'Look for possible harm before you act.',DATA:'Protect information throughout its lifecycle.',GIFT:'Check the gift policy before accepting.',CODE:'A code of conduct guides decisions.'}[w]||'Good judgment starts with everyday habits.'}`;if(d.found.length===4)finish();else commit()}else{s.mistakes++;notice('That is not one of today’s four words. Use Hint to find a starting tile.');save()}}
function trailTap(i){if(!editable())return;let p=state().data.path,cp=checkpoints();if(p.includes(i)){snapshot();p.splice(p.indexOf(i)+1);commit();return}if(!p.length&&cp[i]!==1){notice('Begin at checkpoint 1.');return}if(p.length&&!adjacent(p.at(-1),i,5)){notice('Move one square horizontally or vertically.');return}let next=p.filter(x=>cp[x]).length+1;if(cp[i]&&cp[i]!==next){notice(`Reach checkpoint ${next} before this one.`);return}if(cp[i]===6&&p.length!==24){notice('Fill all 25 squares before finishing at checkpoint 6.');return}snapshot();p.push(i);if(p.length===25)finish();else commit()}
function selectCell(i){if(givens().includes(i)){notice('That code is fixed. Select a blank cell.');return}selected=i;renderGame()}function put(v){if(!editable())return;if(selected<0){notice('Select an empty cell first.');return}snapshot();state().data.values[selected]=v;commit()}function validLogic(v){let groups=[];for(let r=0;r<4;r++)groups.push(v.slice(r*4,r*4+4));for(let c=0;c<4;c++)groups.push([0,1,2,3].map(r=>v[r*4+c]));for(let r of [0,2])for(let c of [0,2])groups.push([v[r*4+c],v[r*4+c+1],v[(r+1)*4+c],v[(r+1)*4+c+1]]);return groups.every(g=>g.every(v=>v>=1&&v<=4)&&new Set(g).size===4)}function checkLogic(){if(!editable())return;if(validLogic(logicValues()))finish();else{state().mistakes++;save();notice('Not quite. Fill every cell, and check for repeated codes in each row, column, and region.')}}
function answer(c){if(!editable())return;let s=state(),q=caseAt(s.data.answers.length);if(c!==q[1]){s.mistakes++;save();notice(`${c} is not the primary risk here. ${q[2]} Try again.`);return}snapshot();s.data.answers.push(c);msg='Correct. '+q[2];if(s.data.answers.length===8)finish();else commit()}function move(i,delta){if(!editable())return;let a=state().data.order,j=i+delta;if(j<0||j>=a.length)return;snapshot();[a[i],a[j]]=[a[j],a[i]];commit()}function checkSequence(){if(!editable())return;if(state().data.order.every((v,i)=>v===i))finish();else{state().mistakes++;save();notice('Not yet. Compare the order with the approved playbook, or use a hint to place the next action.')}}
function undo(){if(!editable()||!history.length)return;state().data=JSON.parse(history.pop());msg='Last move undone.';commit()}function resetGame(){if(!editable()){notice('This daily puzzle is already complete. A new edition arrives tomorrow.');return}snapshot();let old=state();let freshState=fresh(active);old.data=freshState.data;msg='Board reset. Your time and hint count continue.';commit()}function hint(){if(!editable())return;let s=state();s.hints++;snapshot();if(active==='weave'){let row=words().findIndex(w=>!s.data.found.includes(w)),w=words()[row];let start=wordPaths()[row][0];msg=`Look for ${w}. Start at row ${Math.floor(start/4)+1}, column ${start%4+1}, then follow adjacent letters.`;s.data.path=[]}if(active==='trail'){let sol=trailSolution(),p=s.data.path,k=p.findIndex((v,i)=>v!==sol[i]);if(k>=0){p.splice(k);msg='Rewound to the reference route. Try another direction from here.'}else{let next=sol[p.length];p.push(next);msg='Extended your trail by one square.';if(p.length===25){finish();return}}}if(active==='logic'){let v=logicValues(),sol=logicSolution(),i=v.findIndex((v,i)=>v!==sol[i]);if(i>=0){s.data.values[i]=sol[i];selected=i;msg=`Placed code ${sol[i]} in row ${Math.floor(i/4)+1}, column ${i%4+1}.`}else msg='All codes fit. Check your grid!'}if(active==='office'){let next=['desk','screen','files','board'].find(x=>!s.data.solved.includes(x));msg=next?officeClues()[next].hint:'The exit note gives the order: DESK → SCREEN → FILES → BOARD. Read those four digits from your notebook.'}if(active==='risk')msg='Look for '+caseAt(s.data.answers.length)[1]+': '+caseAt(s.data.answers.length)[2];if(active==='sequence'){let a=s.data.order,i=a.findIndex((v,i)=>v!==i);if(i>=0){let j=a.indexOf(i);a.splice(j,1);a.splice(i,0,i);msg=`Placed action ${i+1}: ${incident().steps[i]}`}else msg='The order is ready. Check your sequence!'}commit()}

function officeDigits(){return [0,1,2,3].map(i=>String(mod(seed()*(i+3)+i*7,9)+1))}
function officeClues(){let base=mod(seed(),3)*10;return {
desk:{title:'The desk · Gift register',text:`A note says: “For this exercise, gifts worth MORE THAN ${50+base} credits must be declared.” The register lists five gifts: ${[20,40,60,80,100].map(x=>x+base).join(', ')} credits. How many require a declaration?`,options:['1 gift','2 gifts','3 gifts','4 gifts'],answer:2,hint:`Inspect the desk register. Count only values strictly above ${50+base}; there are three.`,lesson:'Three gifts exceed the stated threshold. Always use the policy that applies to your workplace.'},
screen:{title:'The screen · Access review',text:'The file contains customer identity records. The approved access list is: Maya (case owner) and Lee (assigned investigator). The share panel lists Maya, Lee, Guest link (anyone), and Former contractor. How many entries must be removed to match the approved list?',options:['0 entries','1 entry','2 entries','4 entries'],answer:2,hint:'On the screen, compare each sharing entry with the two approved names. The public link and former contractor are not approved.',lesson:'Remove the public link and former contractor entry. Access should match the approved business need.'},
files:{title:'The files · Retention lock',text:`A label says: “Keep this training record until January 1 of the year SEVEN years after its creation year.” The record was created in ${2020+mod(seed(),4)}. Which is the earliest permitted disposal year under this exercise’s rule?`,options:[6,7,8,9].map(n=>String(2020+mod(seed(),4)+n)),answer:1,hint:`For the files, add seven to ${2020+mod(seed(),4)}. The rule specifies a year, so no extra rounding is needed.`,lesson:'Follow the stated retention schedule. Real records may also be subject to preservation holds.'},
board:{title:'The board · A hidden connection',text:'Three staff are reviewing a supplier: Maya wrote the specification; Noah owns shares in the supplier; Lee independently checked its references. The exercise policy says financial interests must be declared before taking part in selection. Whose connection requires that declaration?',options:['Maya','Noah','Lee','No one'],answer:1,hint:'Read the board’s policy: ownership is a financial interest. Noah owns supplier shares.',lesson:'Noah must disclose the financial interest so it can be assessed and managed before selection.'}}
}
function officeBody(){let d=state().data,spots=['desk','screen','files','board'],names={desk:'Desk',screen:'Screen',files:'Files',board:'Board',door:'Exit door'},clues=officeClues(),spot=d.spot||'desk';let panel='';if(spot==='door'){panel=`<h3>The exit · Four digits to freedom</h3><p>A note above the keypad reads: <strong>DESK → SCREEN → FILES → BOARD</strong>.</p><p>${d.solved.length===4?'All four clues are in your notebook. Enter them in the order above.':'Solve all four room clues before the keypad will unlock.'}</p><form onsubmit="event.preventDefault();unlockOffice()"><label for="office-code">Exit code</label><input class="exit-code" id="office-code" aria-label="Exit code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" value="${esc(d.code)}" oninput="state().data.code=this.value.replace(/[^0-9]/g,'').slice(0,4);save()" ${state().done?'disabled':''}><button class="play" style="width:100%" ${state().done?'disabled':''}>${state().done?'Office unlocked ✓':'Unlock the office →'}</button></form>`}else{let q=clues[spot],solved=d.solved.includes(spot);panel=`<div class="eyebrow">Clue ${spots.indexOf(spot)+1} of 4 ${solved?'· solved ✓':''}</div><h3 style="margin-top:9px">${q.title}</h3><p>${q.text}</p>${solved?`<p><strong>Digit discovered: ${officeDigits()[spots.indexOf(spot)]}</strong></p><p class="muted">${q.lesson}</p><button class="outline" onclick="inspectOffice('${spots.find(x=>!d.solved.includes(x))||'door'}')">${d.solved.length===4?'Go to the exit →':'Inspect the next clue →'}</button>`:`<div class="choices">${q.options.map((o,i)=>`<button class="choice" onclick="answerOffice('${spot}',${i})">${o}</button>`).join('')}</div>`}`}
return `<p class="office-intro">The office is locked for a training challenge. Inspect four objects, solve the clues, and collect the exit code.</p><div class="office-room" role="group" aria-label="Interactive locked office"><div class="office-window" aria-hidden="true"></div><span class="office-caption" aria-hidden="true">NOTICE. THINK. ACT.</span>${[...spots,'door'].map(id=>`<button class="hotspot room-${id} ${spot===id?'focused':''} ${d.solved.includes(id)?'solved':''}" onclick="inspectOffice('${id}')" aria-label="Inspect ${names[id]}${d.solved.includes(id)?', solved':''}">${names[id]}</button>`).join('')}</div><div class="section-head" style="margin-bottom:0"><strong style="font-size:14px">Your clue notebook</strong><span class="muted" style="font-size:12px">${d.solved.length} / 4 found</span></div><div class="notebook">${spots.map((id,i)=>`<div class="clue-digit">${names[id]}<b>${d.solved.includes(id)?officeDigits()[i]:'—'}</b></div>`).join('')}</div><section class="clue-panel" id="office-clue" aria-label="Selected room clue">${panel}</section>`}
function inspectOffice(id){if(!['desk','screen','files','board','door'].includes(id))return;state().data.spot=id;msg=`Inspecting the ${id==='door'?'exit door':id}.`;commit()}
function answerOffice(id,answer){if(!editable()||state().data.solved.includes(id))return;let q=officeClues()[id];if(answer!==q.answer){state().mistakes++;msg='Not quite. Re-read the rule on this object and try again.';commit();return}snapshot();state().data.solved.push(id);msg=q.lesson;commit()}
function unlockOffice(){if(!editable())return;let s=state();if(s.data.solved.length!==4){notice('The keypad needs all four clues. Inspect the remaining objects first.');return}if(s.data.code!==officeDigits().join('')){s.mistakes++;msg='The code does not match. Use the notebook digits in DESK → SCREEN → FILES → BOARD order.';commit();return}finish()}

function finish(){let s=state();s.done=true;s.score=Math.max(100,1000-s.hints*30-s.mistakes*15);store.wins[day]||={};store.wins[day][active]={score:s.score,time:s.elapsed,hints:s.hints};save();practice=false;results()}function results(){let s=state(),g=game();$('#app').innerHTML=`<div class="game-layout"><section><div class="result"><div class="eyebrow">${g.name} · Daily edition ${mod(seed(),999)+1}</div><div class="medal" aria-hidden="true">✺</div><h2>A sharper instinct.<br>One solve at a time.</h2><p>You completed today’s ${g.name}.</p><div class="stats"><div><strong>${s.score}</strong><span>points</span></div><div><strong>${time(s.elapsed)}</strong><span>solve time</span></div><div><strong>${s.hints}</strong><span>hints used</span></div></div><div class="actions"><button class="play" onclick="home()">Play another game →</button><button class="outline" onclick="copyScore()">Copy score</button></div><p id="copy-status" role="status" style="font-size:13px;margin:12px 0 0">${doneCount()} of ${games.length} daily puzzles complete</p></div><div class="panel"><h3>Take it into your workday</h3><p class="muted">${{office:'A safe workplace depends on noticing small details: declared gifts, restricted access, clear retention rules, and disclosed conflicts.',weave:'Words like risk, duty, and care matter most when they turn into everyday actions.',trail:'A clear audit trail connects decisions to evidence. Avoid gaps and keep records in order.',logic:'Access controls work best when permissions are deliberate, consistent, and reviewed.',risk:'Naming a risk is the first step toward responding well. Raise concerns through your organization’s channels.',sequence:'A calm, structured response protects people and preserves evidence. Follow your organization’s approved playbook.'}[active]}</p><button class="outline" onclick="practice=true;msg='Completed puzzle · Your recorded score is preserved.';renderGame()">See completed puzzle</button></div></section><aside class="panel instructions"><h3>${streak()} day streak ✦</h3><p>A solve in any game keeps your daily streak going.</p><div class="dots">${games.map(g=>`<span class="dot ${daily()[g.id]?.done?'yes':''}">${daily()[g.id]?.done?'✓':'·'}</span>`).join('')}</div><h3>Keep the momentum</h3>${games.filter(g=>g.id!==active).map(g=>`<button class="choice" style="width:100%;margin:5px 0" onclick="openGame('${g.id}')">${g.name} <span style="float:right">${daily()[g.id]?.done?'✓':'→'}</span></button>`).join('')}</aside></div>${footer()}`}
async function copyScore(){let text=`Compliance IQ · ${day}\n${game().name}: ${state().score} points · ${time(state().elapsed)} · ${state().hints} hints\n${doneCount()}/${games.length} daily puzzles`;try{await navigator.clipboard.writeText(text);$('#copy-status').textContent='Score copied. Share it wherever you like.'}catch(e){$('#copy-status').innerHTML='<label>Copy your result:<textarea readonly style="width:100%;height:100px">'+esc(text)+'</textarea></label>';$('#copy-status textarea').select()}}
function showStats(){active=null;let badges=[['✦','First instinct','Complete your first puzzle',total()>=1],['✺','Clean sweep','Complete all six in one day',Object.values(store.wins).some(v=>games.every(g=>v[g.id]))],['♜','On a roll','Solve on 3 consecutive days',maxStreak()>=3],['◇','Clear thinker','Complete a puzzle with no hints',Object.values(store.wins).some(v=>Object.values(v).some(x=>x.hints===0))]];$('#app').innerHTML=`<button class="outline" onclick="home()">← Today’s games</button><h1 style="font-size:48px;margin-top:26px">A habit worth keeping.</h1><p class="muted">Your progress stays on this browser.</p><section class="panel"><div class="stats"><div><strong>${total()}</strong><span>puzzles solved</span></div><div><strong>${streak()}</strong><span>current day streak</span></div><div><strong>${maxStreak()}</strong><span>best day streak</span></div></div></section><h2 style="margin-top:30px">Your badges</h2><div class="badge-grid">${badges.map(b=>`<div class="badge ${b[3]?'earned':''}"><b>${b[0]}</b><strong>${b[1]}</strong><br><span>${b[2]}<br>${b[3]?'Unlocked ✓':'Keep going'}</span></div>`).join('')}</div><h2 style="margin-top:30px">Recent solves</h2><section class="panel">${Object.keys(store.wins).sort().reverse().slice(0,7).map(d=>`<div style="margin-bottom:15px"><strong>${d}</strong><div class="muted" style="font-size:14px">${Object.entries(store.wins[d]).map(([id,v])=>`${games.find(g=>g.id===id)?.name}: ${v.score} points (${time(v.time)})`).join(' · ')}</div></div>`).join('')||'<p class="muted">Your first solve is waiting. Pick a game to get started.</p>'}</section>${footer()}`;window.scrollTo(0,0)}function maxStreak(){let dates=Object.keys(store.wins).sort(),max=0,n=0,prev=-Infinity;for(let d of dates){let num=dayNumber(d);n=num===prev+1?n+1:1;max=Math.max(n,max);prev=num}return max}
setInterval(()=>{if(today()!==day){save();day=today();active=null;home();return}if(active&&!document.hidden&&!state().done){state().elapsed++;let el=$('#timer');if(el)el.textContent=time(state().elapsed);save()}},1000);document.addEventListener('keydown',e=>{if(!active||state().done||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(active==='logic'&&/^[0-4]$/.test(e.key)){e.preventDefault();put(+e.key)}else if(active==='logic'&&['Backspace','Delete'].includes(e.key)){e.preventDefault();put(0)}else if(active==='trail'&&e.key.startsWith('Arrow')){e.preventDefault();let p=state().data.path,last=p.at(-1);if(last===undefined){trailTap(trailSolution()[0]);return}let delta={ArrowUp:-5,ArrowDown:5,ArrowLeft:-1,ArrowRight:1}[e.key],next=last+delta;if(next>=0&&next<25&&adjacent(last,next,5))trailTap(next)}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}});home();
</script></body></html>
